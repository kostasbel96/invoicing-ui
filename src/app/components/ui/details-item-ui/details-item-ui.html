@if (loading()) {
  <app-spinner-ui size="3rem" />
} @else {
  <div class="item-page">

    <div class="header">
      <div>
        <h2>{{ title() }}</h2>

        <span class="subtitle">
          {{ subtitle() }}
        </span>
      </div>

      <div class="actions">
        <app-edit-button
          (edit)="edit()"
        />

        <app-delete-button
          (delete)="delete()"
        />
      </div>
    </div>

    <div class="info-card">

      <div class="section-title">
        <i class="pi pi-box"></i>
        <span>{{ sectionTitle() }}</span>
      </div>

      <div class="details-grid">
        @for (field of fields(); track field.key) {
          <div class="field">
            <label [for]="field.key">
              {{ field.label }}
            </label>

            <div class="value">
              {{ getFieldValue(field.key) || '-' }}
            </div>
          </div>
        }
      </div>

    </div>

  </div>
}
