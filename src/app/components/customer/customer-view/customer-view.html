@if (loading()) {
  <app-spinner-ui size="3rem" />
} @else {
  <app-details-item-ui
    [item]="customer"
    [fields]="customerFields"
    [loading]="loading()"
    title="Πληροφορίες Πελάτη"
    subtitle="Στοιχεία πελάτη και βασικές πληροφορίες"
    sectionTitle="Γενικά στοιχεία"
    (editAction)="edit()"
    (deleteAction)="delete()"
  />
  <p-dialog
    header="Επεξεργασία Πελάτη"
    [(visible)]="updateDialogVisible"
    [modal]="true"
    [style]="{ width: '60rem' }"
    [closable]="true">

    <app-customer-form
      [customer]="customer"
      [mode]="'update'"
      (closed)="customerUpdated()">
    </app-customer-form>

  </p-dialog>

  <p-dialog
    header="Διαγραφή Πελάτη"
    [(visible)]="deleteDialogVisible"
    [modal]="true"
    [style]="{ width: '60rem' }"
    [closable]="true">
    <div class="delete-dialog">
      <i class="pi pi-exclamation-triangle warning-icon"></i>

      <h3>Επιβεβαίωση διαγραφής</h3>

      <p>
        Είστε βέβαιοι ότι θέλετε να διαγράψετε τον πελάτη
        <strong>{{ customer?.firstname }} {{customer?.lastname}}</strong>;
      </p>

      <p class="warning-text">
        Η ενέργεια αυτή δεν μπορεί να αναιρεθεί.
      </p>

      <div class="dialog-actions">
        <app-cancel-button (cancelAction)="deleteDialogVisible.set(false)"/>
        <app-delete-button (delete)="confirmDelete()"/>
      </div>
    </div>
  </p-dialog>
}
