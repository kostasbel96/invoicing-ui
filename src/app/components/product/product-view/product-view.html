@if (loading()) {
  <app-spinner-ui size="3rem" />
} @else {
  <app-details-item-ui
    [item]="product"
    [fields]="productFields"
    [loading]="loading()"
    title="Πληροφορίες Προϊόντος"
    subtitle="Στοιχεία προϊόντος και βασικές πληροφορίες"
    sectionTitle="Γενικά στοιχεία"
    (editAction)="edit()"
    (deleteAction)="delete()"
  />
  <p-dialog
    header="Επεξεργασία Προϊόντος"
    [(visible)]="updateDialogVisible"
    [modal]="true"
    [style]="{ width: '60rem' }"
    [closable]="true">

    <app-product-form
      [product]="product"
      [mode]="'update'"
      (closed)="productUpdated()">
    </app-product-form>

  </p-dialog>

  <p-dialog
    header="Διαγραφή Προϊόντος"
    [(visible)]="deleteDialogVisible"
    [modal]="true"
    [style]="{ width: '60rem' }"
    [closable]="true">
    <div class="delete-dialog">
      <i class="pi pi-exclamation-triangle warning-icon"></i>

      <h3>Επιβεβαίωση διαγραφής</h3>

      <p>
        Είστε βέβαιοι ότι θέλετε να διαγράψετε το προϊόν
        <strong>{{ product?.name }}</strong>;
      </p>

      <p class="warning-text">
        Η ενέργεια αυτή δεν μπορεί να αναιρεθεί.
      </p>

      <div class="dialog-actions">
        <app-cancel-button (cancelAction)="deleteDialogVisible.set(false)"/>
        <app-delete-button (delete)="confirmDelete()"/>
      </div>
    </div>
  </p-dialog>
}
